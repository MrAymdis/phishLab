<!DOCTYPE html>
<!-- PhishLab Web 邮箱举报：配置弹窗（导入引导配置 JSON + 状态查看） -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <title>PhishLab 邮件举报</title>
  <style>
    body { width: 340px; margin: 0; padding: 14px; font-family: "Microsoft YaHei", sans-serif; font-size: 13px; color: #1f2937; }
    .head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
    .head img { width: 22px; height: 22px; }
    .status { margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 12px; }
    .status.ok { background: #e8f7ef; color: #0e9f6e; }
    .status.empty { background: #fef3c7; color: #b45309; }
    textarea {
      width: 100%; height: 110px; margin-top: 10px; padding: 8px; font-size: 11px;
      font-family: Consolas, monospace; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box;
    }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    button { flex: 1; padding: 7px 0; font-size: 12px; border-radius: 6px; cursor: pointer; }
    .primary { color: #fff; background: #378ADD; border: none; }
    .ghost { color: #6b7280; background: #fff; border: 1px solid #d1d5db; }
    .muted { font-size: 11px; color: #6b7280; margin-top: 8px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="head"><img src="icons/icon-32.png" alt=""/>PhishLab 邮件举报</div>
  <div id="status" class="status empty">未配置</div>
  <textarea id="cfg" placeholder="粘贴管理员导出的 phishlab-plugin-config.json 文件内容"></textarea>
  <div class="row">
    <button id="save" class="primary">保存配置</button>
    <button id="clear" class="ghost">清除配置</button>
  </div>
  <div class="muted">
    配置后打开 Web 邮箱邮件，点击页面右下角悬浮「举报」按钮即可提交。<br/>
    举报人邮箱需在平台「允许的域名列表」内（已配置时）。
  </div>
  <script src="popup.js"></script>
</body>
</html>
