[tool.poetry]
name = "phishlab-server"
version = "0.1.0"
description = "钓鱼演练平台 - 核心平台服务（FastAPI 模块化单体 + Celery Worker）"
authors = ["PhishLab Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
sqlalchemy = "^2.0"
alembic = "^1.13"
pymysql = "^1.1"
cryptography = "^43.0"
pydantic = "^2.8"
pydantic-settings = "^2.4"
email-validator = "^2.2"
redis = "^5.0"
celery = "^5.4"
httpx = "^0.27"
sse-starlette = "^2.1"
pyjwt = "^2.9"
aiosmtplib = "^3.0"
dnspython = "^2.6"
exchangelib = "^5.2"
minio = "^7.2"
openpyxl = "^3.1"
python-multipart = "^0.0.9"
qrcode = "^8.0"          # 演练邮件二维码变量渲染
pillow = "^12.0"         # qrcode PNG 输出依赖
weasyprint = { version = "^62.3", optional = true }   # PDF 导出，依赖系统库，按需安装

[tool.poetry.extras]
pdf = ["weasyprint"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
